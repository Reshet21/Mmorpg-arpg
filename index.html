<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARKEON · Пепел Завета — Дизайн-библия</title>
<style>
:root{
  --bg:#0b1118; --bg2:#101a24; --panel:#13202c; --line:#243645;
  --gold:#e8b25c; --gold2:#f0d27a; --cyan:#4fd6d0; --violet:#a878e0;
  --red:#d6534f; --text:#e5e9e8; --muted:#9db0bd; --dim:#6f8797;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
.layout{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.side{width:286px;flex:0 0 286px;background:linear-gradient(180deg,#0d1720,#0a1219);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 16px 40px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.brand svg{flex:0 0 42px}
.brand h1{font-size:19px;letter-spacing:4px;margin:0;color:var(--gold2);font-weight:700}
.brand small{display:block;color:var(--dim);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;margin-top:2px}
.tagline{color:var(--muted);font-size:12px;font-style:italic;margin:12px 2px 18px;border-left:2px solid var(--gold);padding-left:10px}
.search{width:100%;padding:9px 11px;background:#0a141d;border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.search:focus{border-color:var(--cyan)}
.navgroup{margin-top:20px}
.navgroup h4{font-size:10.5px;letter-spacing:1.8px;color:var(--dim);text-transform:uppercase;margin:0 0 8px 8px;font-weight:600}
.nav a{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:7px;color:#c7d3d9;font-size:13.2px;line-height:1.35}
.nav a:hover{background:#182836;text-decoration:none}
.nav a.active{background:linear-gradient(90deg,rgba(232,178,92,.18),rgba(232,178,92,.02));color:var(--gold2);border-left:2px solid var(--gold)}
.nav a .num{font-size:11px;color:var(--dim);min-width:22px;font-variant-numeric:tabular-nums}
.nav a.active .num{color:var(--gold)}
.side-foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.side-foot code{color:var(--cyan);font-size:10.5px}
/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:0 0 80px}
.topbar{position:sticky;top:0;z-index:5;background:rgba(11,17,24,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.crumbs{font-size:12.5px;color:var(--muted)} .crumbs b{color:var(--gold2)}
.pill{font-size:11px;border:1px solid var(--line);padding:3px 9px;border-radius:20px;color:var(--muted)}
.content{max-width:1180px;margin:0 auto;padding:30px 34px}
/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;margin-bottom:30px}
.hero h2{font-size:44px;line-height:1.1;letter-spacing:6px;margin:0 0 10px;color:var(--gold2);font-weight:800}
.hero p.lead{font-size:17px;color:#d4ddd9;margin:0 0 18px}
.hero .sub{color:var(--muted);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 30px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 14px}
.kpi b{display:block;font-size:26px;color:var(--gold2);letter-spacing:.5px;line-height:1.2}
.kpi span{font-size:11.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px}
.card h3{margin:0 0 12px;font-size:16px;color:var(--gold2);letter-spacing:.4px}
.card p{color:#c6d2d5;font-size:13.5px}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.pillar{border:1px solid var(--line);border-radius:10px;padding:13px;background:#0e1a24}
.pillar b{color:var(--cyan);font-size:13px} .pillar p{font-size:12px;color:var(--muted);margin:6px 0 0}
.launchpad{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.launch{border:1px solid var(--line);background:#0f1c27;border-radius:10px;padding:14px;text-align:left;color:var(--text);transition:.15s}
.launch:hover{border-color:var(--gold);transform:translateY(-2px);text-decoration:none}
.launch b{display:block;color:var(--gold2);font-size:13.5px;margin-bottom:4px}
.launch span{font-size:11.5px;color:var(--muted)}
.diagram{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.dbox{background:#0d1a24;border:1px solid var(--line);border-radius:9px;padding:12px 10px;font-size:11.5px;color:#cbd7d9}
.dbox b{display:block;color:var(--cyan);font-size:12px;margin-bottom:5px}
.dbox.gold b{color:var(--gold)}
.dbox.violet b{color:var(--violet)}
/* map */
.mapwrap{background:#0a141d;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.layers{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.layer-btn{background:#132432;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:11.5px}
.layer-btn.on{background:rgba(79,214,208,.14);border-color:var(--cyan);color:var(--cyan)}
/* classes */
.classgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.classcard{background:#0f1c27;border:1px solid var(--line);border-radius:12px;padding:16px}
.classcard h4{margin:0 0 3px;color:var(--gold2);font-size:16px}
.classcard .role{font-size:11.5px;color:var(--cyan);margin-bottom:10px}
.classcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:11.8px;margin:0}
.classcard dt{color:var(--dim)} .classcard dd{margin:0;color:#cdd8da}
.classcard .specs{margin-top:10px;font-size:11.5px;color:var(--muted)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{background:#0a141d;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chart svg,.chart img{display:block;width:100%;height:auto}
.chart .cap{padding:9px 14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}
/* ---------- markdown ---------- */
.md h1{font-size:31px;color:var(--gold2);letter-spacing:.6px;margin:0 0 8px;line-height:1.25}
.md h2{font-size:23px;color:var(--gold2);margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.md h3{font-size:18px;color:#e7d7ad;margin:26px 0 10px}
.md h4{font-size:15px;color:var(--cyan);margin:20px 0 8px}
.md p{color:#d2dcdd;margin:10px 0}
.md blockquote{border-left:3px solid var(--gold);background:#101d28;margin:14px 0;padding:10px 16px;color:var(--muted);font-size:13.5px}
.md blockquote p{margin:4px 0}
.md ul,.md ol{padding-left:22px;color:#d2dcdd} .md li{margin:4px 0}
.md code{background:#0b1a24;border:1px solid #1e3340;border-radius:4px;padding:1px 5px;color:var(--cyan);font-size:12.5px}
.md pre{background:#08131c;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;font-size:12.5px;line-height:1.55}
.md pre code{background:none;border:0;padding:0;color:#bcd6d3}
.md pre.mermaid{background:#0c1a22;border-left:3px solid var(--violet)}
.md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:12.9px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:#162634;color:var(--gold2);white-space:nowrap}
.md tr:nth-child(even) td{background:rgba(255,255,255,.018)}
.md td{color:#cdd8da;min-width:90px}
.md hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.md a{color:var(--cyan);border-bottom:1px dotted rgba(79,214,208,.5)}
.md .check{list-style:none;margin-left:-18px}
.md .check:before{content:"☐ ";color:var(--gold)}
.md .mermaid-note{font-size:11px;color:var(--dim);margin-top:-8px;margin-bottom:10px}
.docmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px;font-size:11.5px;color:var(--dim)}
.docmeta a{border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--cyan)}
.status i{width:7px;height:7px;background:var(--cyan);border-radius:50%;display:inline-block}
.loader{color:var(--muted);padding:40px;text-align:center}
@media(max-width:1100px){.hero{grid-template-columns:1fr}.kpis,.launchpad,.diagram{grid-template-columns:repeat(2,1fr)}.classgrid,.charts,.grid2{grid-template-columns:1fr}}
@media(max-width:760px){.side{position:relative;width:100%;height:auto;flex-basis:auto;border-right:0;border-bottom:1px solid var(--line)}.layout{display:block}.content{padding:22px 16px}.topbar{padding:10px 16px}.kpis,.launchpad,.diagram,.classgrid,.charts,.grid2{grid-template-columns:1fr}.hero h2{font-size:32px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 48 48" width="42" height="42" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="#0e1a24" stroke="#e8b25c" stroke-width="1.5"/>
        <g stroke="#e8b25c" stroke-width="2.4" stroke-linecap="round">
          <line x1="24" y1="24" x2="24" y2="7"/><line x1="24" y1="24" x2="38" y2="13"/>
          <line x1="24" y1="24" x2="41" y2="27"/><line x1="24" y1="24" x2="34" y2="39"/>
          <line x1="24" y1="24" x2="14" y2="40"/><line x1="24" y1="24" x2="8" y2="32"/>
        </g>
        <line x1="24" y1="24" x2="9" y2="13" stroke="#6b3fa8" stroke-width="2.4" stroke-dasharray="3 3" stroke-linecap="round"/>
        <circle cx="24" cy="24" r="4.5" fill="#f0d27a"/>
      </svg>
      <div><h1>АРКЕОН</h1><small>Пепел Завета · Design Bible</small></div>
    </div>
    <div class="tagline">«Мир не погиб. Он перестал держать слово.»</div>
    <input id="search" class="search" placeholder="Поиск по документам…" autocomplete="off">
    <nav id="nav" class="nav"></nav>
    <div class="side-foot">
      Источник истины: <code>data/canon.json</code><br>
      Проверка: <code>python3 tools/verify_canon.py</code><br>
      Версия 1.2 · 2027-Q1 · 16 документов · G2
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumbs" id="crumbs"><b>ARKEON</b> / Обзор</div>
      <div style="display:flex;gap:8px"><span class="pill" id="pill">F2P · без P2W</span><span class="pill">UE 5.6 · Android · iOS · ПК</span></div>
    </div>
    <div class="content" id="content"><div class="loader">Загрузка дизайн-библии…</div></div>
  </main>
</div>

<script>
/* ============================ данные навигации ============================ */
const DOCS=[
 {f:'01-title.md',       t:'Название и бренд',        g:'Видение'},
 {f:'02-lore.md',        t:'Лор и сюжет',             g:'Видение'},
 {f:'03-gdd.md',         t:'Полный GDD',              g:'Видение'},
 {f:'04-world-map.md',   t:'Карта мира',              g:'Игра'},
 {f:'05-classes.md',     t:'Классы',                  g:'Игра'},
 {f:'06-economy.md',     t:'Экономика',               g:'Игра'},
 {f:'07-mechanics.md',   t:'Все игровые механики',    g:'Игра'},
 {f:'08-server.md',      t:'Архитектура сервера',     g:'Технологии'},
 {f:'09-client.md',      t:'Архитектура клиента',     g:'Технологии'},
 {f:'10-db.md',          t:'Структура базы данных',   g:'Технологии'},
 {f:'11-roadmap.md',     t:'Roadmap разработки',      g:'Бизнес'},
 {f:'12-monetization.md',t:'План монетизации',        g:'Бизнес'},
 {f:'13-budget.md',      t:'Оценка бюджета',          g:'Бизнес'},
 {f:'14-team.md',        t:'Состав команды',          g:'Бизнес'},
 {f:'15-launch.md',      t:'Запуск и продвижение',    g:'Бизнес'},
 {f:'16-mobile.md',      t:'Мобильная версия (G1)',   g:'Мобильная'},
];
const VIEWS=[
 {id:'overview', t:'Обзор', g:'Видение'},
 {id:'map',      t:'Карта мира (интерактивная)', g:'Видение'},
 {id:'classes',  t:'Классы (18 специализаций)', g:'Видение'},
 {id:'models',   t:'Модели и расчёты', g:'Видение'},
];
const ALL=[...VIEWS,...DOCS.map(d=>({id:d.f,t:d.t,g:d.g}))];
const nav=document.getElementById('nav');
const groups=['Видение','Игра','Технологии','Бизнес','Мобильная'];
let active='overview';
function buildNav(filter=''){
  nav.innerHTML='';
  groups.forEach(g=>{
    const items=ALL.filter(x=>x.g===g && (x.t.toLowerCase().includes(filter)||x.id.toLowerCase().includes(filter)));
    if(!items.length)return;
    const sec=document.createElement('div');sec.className='navgroup';
    sec.innerHTML=`<h4>${g}</h4>`;
    items.forEach(x=>{
      const a=document.createElement('a');a.href='#'+x.id;a.dataset.id=x.id;
      a.innerHTML=`<span class="num">${x.id==='overview'?'★':x.id==='map'?'◈':x.id==='classes'?'✦':x.id==='models'?'∑':x.id.slice(0,2)}</span><span>${x.t}</span>`;
      if(x.id===active)a.classList.add('active');
      a.onclick=e=>{e.preventDefault();go(x.id)};
      sec.appendChild(a);
    });
    nav.appendChild(sec);
  });
}
buildNav();
document.getElementById('search').addEventListener('input',e=>buildNav(e.target.value.trim().toLowerCase()));

/* ============================Мини-рендерер Markdown ============================ */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g,'$1<em>$2</em>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,txt,url)=>{
    const target=url.replace(/^docs\//,'').replace(/^\.\//,'');
    const found=DOCS.find(d=>d.f===target||target.startsWith(d.f.slice(0,2)));
    if(found&&!url.startsWith('http'))return `<a href="#${found.f}" data-doc="${found.f}">${txt}</a>`;
    if(/^https?:/.test(url))return `<a href="${url}" target="_blank" rel="noopener">${txt}</a>`;
    return `<a href="${url}" target="_blank" rel="noopener">${txt}</a>`;
  });
  return s;
}
function renderMD(md){
  md=md.replace(/<!--[\s\S]*?-->/g,'');
  const L=md.split('\n');let out=[],i=0;
  const isTable=l=>/^\s*\|/.test(l);
  while(i<L.length){
    let l=L[i];
    if(!l.trim()){i++;continue}
    if(/^```/.test(l.trim())){
      const lang=l.trim().slice(3).trim();let buf=[];
      i++;while(i<L.length&&!/^```/.test(L[i].trim())){buf.push(L[i]);i++}i++;
      const cls=lang==='mermaid'?'mermaid':'';
      out.push(`<pre class="${cls}"><code>${esc(buf.join('\n'))}</code></pre>`);
      if(lang==='mermaid')out.push('<p class="mermaid-note">Mermaid-диаграмма: в GitHub она отображается графически, здесь показан исходник.</p>');
      continue;
    }
    if(/^#{1,4}\s/.test(l)){
      const n=(l.match(/^#+/)||[''])[0].length;
      out.push(`<h${n}>${inline(l.replace(/^#+\s*/,''))}</h${n}>`);i++;continue;
    }
    if(/^>\s?/.test(l)){
      let buf=[];while(i<L.length&&/^>\s?/.test(L[i])){buf.push(L[i].replace(/^>\s?/,''));i++}
      out.push(`<blockquote>${buf.map(x=>`<p>${inline(x)}</p>`).join('')}</blockquote>`);continue;
    }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(l)){out.push('<hr>');i++;continue}
    if(isTable(l)){
      let rows=[];while(i<L.length&&isTable(L[i])){rows.push(L[i].trim());i++}
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(rows[0]);
      let body=rows.slice(rows[1]&&/^[\|\s:\-]+$/.test(rows[1])?2:1).map(r=>`<tr>${cells(r).map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('');
      out.push(`<table><thead><tr>${head.map(h=>`<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`);
      continue;
    }
    if(/^\s*([-*]|\d+\.)\s/.test(l)){
      const ordered=/^\s*\d+\./.test(l);let buf=[];
      while(i<L.length&&/^\s*([-*]|\d+\.)\s/.test(L[i])){
        let raw=L[i].replace(/^\s*([-*]|\d+\.)\s/,'');
        let cls='';
        if(/^\[[ xX]\]/.test(raw)){cls=' class="check"';raw=raw.replace(/^\[[ xX]\]\s*/,'')}
        buf.push(`<li${cls}>${inline(raw)}</li>`);i++;
      }
      out.push(`<${ordered?'ol':'ul'}>${buf.join('')}</${ordered?'ol':'ul'}>`);continue;
    }
    // paragraph
    let buf=[];
    while(i<L.length&&L[i].trim()&&!/^#{1,4}\s|^>|^```|^\s*(---|\*\*\*|___)\s*$/.test(L[i])&&!isTable(L[i])&&!/^\s*([-*]|\d+\.)\s/.test(L[i])){buf.push(L[i]);i++}
    out.push(`<p>${inline(buf.join(' '))}</p>`);
  }
  return out.join('\n');
}
function bindDocLinks(root){
  root.querySelectorAll('a[data-doc]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.doc)});
}

/* ============================ роутер ============================ */
const content=document.getElementById('content');
const crumbs=document.getElementById('crumbs');
async function fetchText(p){const r=await fetch(p);if(!r.ok)throw new Error(p+' → '+r.status);return r.text()}
function setHeader(title,sub){crumbs.innerHTML=`<b>ARKEON</b> / ${sub?sub+' / ':''}${title}`}
function go(id){
  active=id;buildNav(document.getElementById('search').value.trim().toLowerCase());
  location.hash=id;
  const v=ALL.find(x=>x.id===id);
  setHeader(v?v.t:'Обзор',v&&v.g!=='Видение'?v.g:'');
  if(id==='overview')return viewOverview();
  if(id==='map')return viewMap();
  if(id==='classes')return viewClasses();
  if(id==='models')return viewModels();
  content.innerHTML='<div class="loader">Загрузка документа…</div>';
  fetchText('docs/'+id).then(md=>{
    content.innerHTML=`<div class="docmeta"><span class="status"><i></i> Утверждено к препродакшену · v1.0</span>
      <span>·</span><a href="docs/${id}" target="_blank" rel="noopener">Открыть Markdown ↗</a>
      <span>·</span><span>Источник: docs/${id}</span></div><article class="md" id="article">${renderMD(md)}</article>`;
    bindDocLinks(content);
    window.scrollTo({top:0,behavior:'instant'});
  }).catch(e=>{content.innerHTML=`<div class="loader">Не удалось загрузить docs/${id}: ${e.message}<br><small>Запустите локальный сервер: <code>python3 -m http.server 8000</code></small></div>`});
}

/* ============================ Обзор ============================ */
function viewOverview(){
  content.innerHTML=`
  <div class="hero">
    <div>
      <h2>АРКЕОН<br>ПЕПЕЛ ЗАВЕТА</h2>
      <p class="lead">Изометрическая MMORPG-ARPG нового поколения: бой уровня Diablo IV, социальная ткань уровня World of Warcraft, экономика уровня Albion Online.</p>
      <p class="sub">Шесть классов · восемнадцать специализаций · общий мир на тысячи игроков · осады 200 на 200 · только косметика за деньги.</p>
      <div class="launchpad" style="margin-top:20px">
        <button class="launch" onclick="go('03-gdd.md')"><b>Читать GDD →</b><span>Мастер-документ проекта</span></button>
        <button class="launch" onclick="go('map')"><b>Карта мира →</b><span>14 регионов, переключаемые слои</span></button>
