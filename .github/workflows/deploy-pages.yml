name: Deploy ARKEON mobile PWA to GitHub Pages

# Публикация статического PWA на бесплатном хостинге GitHub Pages.
#
# Первичное включение Pages делает владелец репозитория в браузере:
#   Settings → Pages → Source:
#     · «Deploy from a branch» → arena/bfc40927-mmorpg-arpg → /(root)
#       (сайт обновляется автоматически при каждом push, этот воркфлоу не нужен);
#     · либо «GitHub Actions» → затем запустить этот воркфлоу вручную.
# Токены GitHub App не могут создать Pages site через REST API (403
# «Resource not accessible by integration»), поэтому enablement намеренно
# не вызывается: один пользовательский клик нельзя заменить программно.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
